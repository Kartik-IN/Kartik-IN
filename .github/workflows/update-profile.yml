name: update profile projects

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".profile/projects.json"
      - "scripts/update_profile.py"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile
        uses: actions/checkout@v4

      - name: Render project cards
        run: python3 scripts/update_profile.py

      - name: Commit generated README
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: update profile project cards"
          file_pattern: README.md
